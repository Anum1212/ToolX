# Builds the signed release APK and attaches it to the GitHub release.
#
# Runs by itself when a release is published. For a release that already exists, open
# Actions > "Build release APK" > Run workflow, and type its tag (e.g. v1.0.0).
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Build release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The repo has no gradlew; use the same Gradle version as local builds.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toolx-release.jks"

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/toolx-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # "v1.2.0" -> "1.2.0". The run number keeps each build's version code higher than the last.
          VERSION_NAME: ${{ env.TAG }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          export VERSION_CODE=$((100 + VERSION_CODE))
          gradle --console=plain :app:assembleRelease

      - name: Check the APK is signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "CN=ToolX" certs.txt || { echo "::error::APK isn't signed with the ToolX release key"; exit 1; }

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ToolX-$TAG.apk"
          gh release upload "$TAG" "ToolX-$TAG.apk" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/toolx-release.jks"
